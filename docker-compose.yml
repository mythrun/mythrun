# NOT A SECRET: POSTGRES_PASSWORD below is local-only, 127.0.0.1-bound,
# fake-data only. See spec §7.8.

name: mythrun

services:
  postgres:
    image: pgvector/pgvector:pg16
    command: ["postgres", "-c", "max_connections=200"]
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: mythrun
      POSTGRES_PASSWORD: mythrun_dev
      # POSTGRES_DB is the db created on first volume init. mythrun_test is
      # created by ./scripts/postgres-init/01-create-test-db.sql mounted at
      # /docker-entrypoint-initdb.d (myth-oehx).
      POSTGRES_DB: mythrun_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mythrun -d mythrun_dev -h 127.0.0.1']
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # Note: redis-cli ping does NOT exercise auth. If requirepass is added
  # later, healthchecks pass while real clients with wrong creds fail.
  redis-realtime:
    image: redis:7.2-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '-h', '127.0.0.1', 'ping']
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  redis-batch:
    image: redis:7.2-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '127.0.0.1:6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '-h', '127.0.0.1', 'ping']
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  pgdata:
