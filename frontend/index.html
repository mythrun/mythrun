<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mythrun</title>
    <!-- Placeholder favicon (kills the 404; the real mark is the brand pass's call): paper square, ink dither. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23f5f0e8'/%3E%3Crect x='6' y='6' width='4' height='4' fill='%232b2620'/%3E%3Crect x='3' y='3' width='2' height='2' fill='%232b2620'/%3E%3Crect x='11' y='11' width='2' height='2' fill='%232b2620'/%3E%3C/svg%3E" />
    <script>
      // Pre-paint theme: apply .dark before React mounts so there is no
      // flash-of-wrong-theme. Mirrors ThemeProvider's resolution
      // (stored('mythrun-theme') ?? prefers-color-scheme). Kept tiny + inline.
      (function () {
        try {
          var t = localStorage.getItem('mythrun-theme')
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          if (t === 'dark') document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
