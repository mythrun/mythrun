name: Frontend check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter @mythrun/web... --filter @mythrun/ui... --filter @mythrun/client-core... --filter @mythrun/contract...

      # Cache the Playwright Chromium download for the @mythrun/web overflow gate.
      - uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # @mythrun/contract — the shared Zod wire contract, and the ONLY frontend
      # package that ships compiled output (NodeNext dist, consumed by both the
      # backend and the Bundler frontend). dist/ is gitignored, so it must be
      # built before any consumer typecheck/test — exactly like .husky/pre-push
      # gate 0 and the backend Dockerfile. Without this, a fresh runner fails to
      # resolve `@mythrun/contract/rest` even though local trees stay warm.
      - run: pnpm --filter @mythrun/contract build

      # @mythrun/client-core — the platform-neutral client brain (contract +
      # tokens). Logic-tested + 100% coverage gated (its own tiered config).
      - run: pnpm --filter @mythrun/client-core typecheck
      - run: pnpm --filter @mythrun/client-core lint
      - run: pnpm --filter @mythrun/client-core test
      - run: pnpm --filter @mythrun/client-core test:coverage

      # @mythrun/ui — the design system. typecheck/lint + CSS lint, behavior
      # tests + tiered coverage, and the story-coverage gate (every component
      # ships a story). The unified Storybook now lives in @mythrun/web.
      - run: pnpm --filter @mythrun/ui typecheck
      - run: pnpm --filter @mythrun/ui lint
      - run: pnpm --filter @mythrun/ui lint:css
      - run: pnpm --filter @mythrun/ui test
      - run: pnpm --filter @mythrun/ui test:coverage
      - run: pnpm --filter @mythrun/ui story-coverage

      # @mythrun/web — the app shell (consumes @mythrun/ui).
      - run: pnpm --filter @mythrun/web typecheck
      - run: pnpm --filter @mythrun/web lint
      - run: pnpm --filter @mythrun/web test
      - run: pnpm --filter @mythrun/web test:coverage
      - run: pnpm --filter @mythrun/web build
      # Screen-story-coverage forcing function (every screen ships a story).
      - run: pnpm --filter @mythrun/web screen-story-coverage
      # The 375/1280 mobile-viewport overflow gate (Playwright/Chromium). Build the
      # unified Storybook once, then run the test-runner sweep against the static
      # build. Browser is cached above; --with-deps installs OS libs on a cache miss.
      - run: pnpm --filter @mythrun/web exec playwright install --with-deps chromium
      - run: pnpm --filter @mythrun/web build-storybook
      - run: pnpm --filter @mythrun/web test-storybook:ci
