name: Dev tool check

on:
  pull_request:
    paths:
      - 'backend/src/contract/**'
      - 'backend/src/dev-tool-check/**'
      - 'backend/dev-tool/**'
      - 'backend/scripts/dev-tool-check.ts'
      - 'backend/package.json'
      - '.github/workflows/dev-tool-check.yml'
  push:
    branches: [main]
    paths:
      - 'backend/src/contract/**'
      - 'backend/src/dev-tool-check/**'
      - 'backend/dev-tool/**'
      - 'backend/scripts/dev-tool-check.ts'
      - 'backend/package.json'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter @mythrun/backend... --filter @mythrun/contract...

      # dev-tool:check resolves backend sources that re-export @mythrun/contract
      # (NodeNext dist, gitignored) — build it first, same as .husky/pre-push gate 0.
      - run: pnpm --filter @mythrun/contract build

      - run: pnpm dev-tool:check
