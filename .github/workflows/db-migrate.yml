# Manual operator entry point for applying pending DB migrations against
# staging RDS. Use cases (myth-0m1n design):
#   - first-apply on fresh / DR-restored DB before API rolls
#   - re-run after a cosmetic workflow failure (logs step died but the
#     migration applied — re-running confirms idempotency)
#   - confidence-check during incident response ("are all migrations
#     applied?")
#
# Auto-on-push is owned by deploy.yml's `db-migrate` job, which has
# `needs: build` so the just-built mythrun:<sha> image exists in ECR
# before migrate runs. This file does NOT have a `push:` trigger —
# previously it did, which produced a same-commit race with Deploy.build
# and surfaced as ImageNotFoundException when migrate read the SHA
# before build finished pushing.

name: db-migrate

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  migrate:
    uses: ./.github/workflows/_db-migrate-job.yml
