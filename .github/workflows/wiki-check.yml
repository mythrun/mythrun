name: Wiki

on:
  pull_request:
    paths:
      - 'docs/wiki/**'
      - 'infra/**'
      - 'backend/**'
      - '.github/workflows/wiki-check.yml'
  push:
    branches: [main]
    paths:
      - 'docs/wiki/**'
      - 'infra/**'
      - 'backend/**'

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector image (matches docker-compose + the backend deploy CI): the
        # wiki schema-extractor tests apply ALL migrations to a throwaway schema,
        # and 026_world_retrieval.sql does `CREATE EXTENSION vector`. The plain
        # postgres image lacks vector.control → "extension vector is not available".
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mythrun
          POSTGRES_PASSWORD: mythrun_dev
          POSTGRES_DB: mythrun
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mythrun"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://mythrun:mythrun_dev@localhost:5432/mythrun
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck wiki
        run: pnpm --filter @mythrun/wiki typecheck
      - name: Test wiki
        run: pnpm --filter @mythrun/wiki test
      - name: Check wiki freshness
        run: pnpm wiki:check
